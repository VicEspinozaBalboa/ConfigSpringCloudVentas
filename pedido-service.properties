server.port = 8081

spring.datasource.url = jdbc:h2:mem:pedidos
spring.datasource.username = root
spring.datasource.password = 123456
spring.datasource.driver-class-name = org.h2.Driver
spring.jpa.hibernate.ddl-auto = update
#circuitBreaker
resilience4j.circuitbreaker.instances.productoServiceCB.waitDurationInOpenState=5m
resilience4j.circuitbreaker.instances.productoServiceCB.slidingWindowSize=10
resilience4j.circuitbreaker.instances.productoServiceCB.permittedNumberOfCallsInHalfOpenState=5
resilience4j.circuitbreaker.instances.productoServiceCB.failureRateThreshold=50
resilience4j.circuitbreaker.instances.productoServiceCB.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.productoServiceCB.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.productoServiceCB.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.productoServiceCB.maxWaitDurationInHalfOpenState=1m
resilience4j.timelimiter.instances.productoServiceCB.timeoutDuration=10s
# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
#prometheus
management.metrics.export.prometheus.enabled=true